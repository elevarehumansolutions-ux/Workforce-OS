[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = [
    "D203", # incorrect-blank-line-before-class — conflicts with D211 (chosen below)
    "D213", # multi-line-summary-second-line — conflicts with D212 (chosen below)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
