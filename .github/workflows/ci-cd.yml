name: CD

# The test and lint job (CI) was REMOVED on 2026-10-22 at the product owner's
# request, to merge urgent work quickly: there is no check on pull requests and
# nothing gates a merge. The previous version, with the test job (Postgres and
# Redis services, the restricted elevare_app role, migrations, ruff, pytest), is
# in git history (`git log -- .github/workflows/ci-cd.yml`); restore it with
# `git revert` of the commit that removed it.
#
# Deploy is KEPT so that merging to main still updates the server. It now runs
# on every push to main without waiting for tests.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/elevare
            git pull origin main
            # --force-recreate matters for services like caddy, which use a
            # plain `image:` (no `build:` key) with Caddyfile bind-mounted in
            # — --build alone never rebuilds or restarts it, so a config-only
            # change (e.g. a new domain in Caddyfile) would otherwise silently
            # never take effect on a real deploy, only after a manual recreate.
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
